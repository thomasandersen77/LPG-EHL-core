# =============================================================================
# LPG EMULATOR INSTANCES - For Windows Dispenserkontroll Testing
# =============================================================================
# This file starts 3 emulator instances that Windows Dispenserkontroll can
# connect to from your Windows VM.
#
# Usage:
#   docker-compose -f docker-compose-emulators.yml up -d
#
# Windows Dispenserkontroll connections:
#   - S001: 192.168.0.41:9001 (TCP) + http://localhost:8091 (API)
#   - S002: 192.168.0.41:9002 (TCP) + http://localhost:8092 (API)
#   - S003: 192.168.0.41:9003 (TCP) + http://localhost:8093 (API)
#
# All emulators send heartbeat to MinLPG backend at http://host.docker.internal:8081
# =============================================================================

services:
  # ===========================================================================
  # EMULATOR S001 - Drammen Sentrum
  # ===========================================================================
  emulator-s001:
    build:
      context: .
      dockerfile: lpg-ehl-emulator/Dockerfile
    container_name: emulator-s001
    environment:
      # Station Identity
      STATION_ID: S001
      EDGE_ID: EDGE-S001-LOCAL
      DISPENSER_ID: D001
      
      # Emulator Configuration
      EMULATOR_PORT: 9000
      EMULATOR_ADDRESS: 1
      EMULATOR_PRICE_PER_LITRE_CENTS: 1590  # 15.90 kr/L
      EMULATOR_LITRES_PER_SECOND: 0.5
      
      # Cloud Integration (MinLPG backend on host)
      LPG_API_BASE_URL: http://host.docker.internal:8081
      
      # Heartbeat
      heartbeat.enabled: "true"
      heartbeat.interval-seconds: 30
      
      # Spring Boot
      PORT: 8090
      
    ports:
      - "9001:9000"  # TCP port for Dispenserkontroll
      - "8091:8090"  # REST API
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      station: "S001"
      location: "Drammen Sentrum"

  # ===========================================================================
  # EMULATOR S002 - Oslo Vest
  # ===========================================================================
  emulator-s002:
    build:
      context: .
      dockerfile: lpg-ehl-emulator/Dockerfile
    container_name: emulator-s002
    environment:
      # Station Identity
      STATION_ID: S002
      EDGE_ID: EDGE-S002-LOCAL
      DISPENSER_ID: D001
      
      # Emulator Configuration
      EMULATOR_PORT: 9000
      EMULATOR_ADDRESS: 1
      EMULATOR_PRICE_PER_LITRE_CENTS: 1620  # 16.20 kr/L
      EMULATOR_LITRES_PER_SECOND: 0.5
      
      # Cloud Integration (MinLPG backend on host)
      LPG_API_BASE_URL: http://host.docker.internal:8081
      
      # Heartbeat
      heartbeat.enabled: "true"
      heartbeat.interval-seconds: 30
      
      # Spring Boot
      PORT: 8090
      
    ports:
      - "9002:9000"  # TCP port for Dispenserkontroll
      - "8092:8090"  # REST API
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      station: "S002"
      location: "Oslo Vest"

  # ===========================================================================
  # EMULATOR S003 - Trondheim Lade
  # ===========================================================================
  emulator-s003:
    build:
      context: .
      dockerfile: lpg-ehl-emulator/Dockerfile
    container_name: emulator-s003
    environment:
      # Station Identity
      STATION_ID: S003
      EDGE_ID: EDGE-S003-LOCAL
      DISPENSER_ID: D001
      
      # Emulator Configuration
      EMULATOR_PORT: 9000
      EMULATOR_ADDRESS: 1
      EMULATOR_PRICE_PER_LITRE_CENTS: 1580  # 15.80 kr/L
      EMULATOR_LITRES_PER_SECOND: 0.5
      
      # Cloud Integration (MinLPG backend on host)
      LPG_API_BASE_URL: http://host.docker.internal:8081
      
      # Heartbeat
      heartbeat.enabled: "true"
      heartbeat.interval-seconds: 30
      
      # Spring Boot
      PORT: 8090
      
    ports:
      - "9003:9000"  # TCP port for Dispenserkontroll
