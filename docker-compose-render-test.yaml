version: '3.8'

# This docker-compose mimics the Render deployment environment locally
# Use this to test that the services work together before pushing to Render

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: lpg-postgres-render-test
    environment:
      POSTGRES_DB: lpg_db
      POSTGRES_USER: lpg_user
      POSTGRES_PASSWORD: lpg_password_test
    ports:
      - "5433:5432"  # Different port to avoid conflict with local dev
    volumes:
      - postgres-data-render:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpg_user -d lpg_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LPG Emulator (simulates dispenser)
  emulator:
    build:
      context: .
      dockerfile: Dockerfile.emulator
    container_name: lpg-emulator-render-test
    environment:
      # Simulate Render's PORT env var
      PORT: 10000
      JAVA_TOOL_OPTIONS: "-Dserver.port=10000"
      SPRING_PROFILES_ACTIVE: production
      EMULATOR_ADDRESS: 1
      EMULATOR_PRICE_PER_LITRE_CENTS: 1590
      EMULATOR_LITRES_PER_SECOND: 0.5
    ports:
      - "10000:10000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:10000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # LPG API (main backend)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: lpg-api-render-test
    depends_on:
      postgres:
        condition: service_healthy
      emulator:
        condition: service_healthy
    environment:
      # Simulate Render's PORT env var
      PORT: 10001
      JAVA_TOOL_OPTIONS: "-Dserver.port=10001"
      SPRING_PROFILES_ACTIVE: production
      # Database connection (matches Render's fromDatabase syntax)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lpg_db
      SPRING_DATASOURCE_USERNAME: lpg_user
      SPRING_DATASOURCE_PASSWORD: lpg_password_test
      # Emulator connection (internal networking like Render)
      EMULATOR_BASE_URL: http://emulator:10000
      # Security token
      API_AUTH_TOKEN: test-token-render-12345
      # CORS
      CORS_ALLOWED_ORIGINS: http://localhost:3001,http://localhost:5173
      # Azure disabled for test
      AZURE_ENABLED: false
      AZURE_STORAGE_CONNECTION_STRING: ""
    ports:
      - "10001:10001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10001/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres-data-render:
    driver: local

# Test the setup:
# 1. Build: docker-compose -f docker-compose-render-test.yaml build
# 2. Start: docker-compose -f docker-compose-render-test.yaml up
# 3. Check API health: curl http://localhost:10001/actuator/health
# 4. Check emulator health: curl http://localhost:10000/actuator/health
# 5. Check emulator logs: curl http://localhost:10000/api/emulator/internal/logs
# 6. Test API endpoint: curl -H "Authorization: Bearer test-token-render-12345" http://localhost:10001/api/v1/health
# 7. Stop: docker-compose -f docker-compose-render-test.yaml down
