spring:
  application:
    name: lpg-ehl-headless
  main:
    # DEFAULT: No web server (headless mode)
    # Activate debug-api profile to enable Undertow web server
    web-application-type: none
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lpg_ehl}
    username: ${DB_USER:lpg_user}
    password: ${DB_PASSWORD:lpg_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    liquibase-schema: public
    drop-first: false
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Azure Storage Queue Configuration
azure:
  enabled: ${AZURE_ENABLED:false}  # Default to false for LAB mode testing
  storage:
    connection-string: ${AZURE_CONNECTION_STRING:UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://localhost:10001}
    queue-name: ${AZURE_QUEUE_NAME:lpg-transactions}
  sync:
    interval-seconds: ${AZURE_SYNC_INTERVAL:300}
    batch-size: ${AZURE_SYNC_BATCH_SIZE:10}
    max-retries: ${AZURE_SYNC_MAX_RETRIES:3}

# Nets Cloud Connect Configuration (SSL/TLS Socket)
nets:
  cloud-connect:
    host: ${NETS_CLOUD_HOST:3.33.230.243}
    port: ${NETS_CLOUD_PORT:6001}
    connect-timeout-ms: ${NETS_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${NETS_READ_TIMEOUT_MS:30000}

# Logging Configuration (headless-specific)
logging:
  level:
    root: INFO
    no.cloudberries.lpg: INFO
    no.cloudberries.lpg.headless: INFO
    no.cloudberries.lpg.service: INFO
    no.cloudberries.lpg.protocol: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:/var/log/lpg-ehl/headless.log}
    max-size: 10MB
    max-history: 30

# ═══════════════════════════════════════════════════════════════════════════════
# EHL PROTOCOL CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
# 
# TRI-MODE ARKITEKTUR (ehl.transport.mode):
#
#   EMULATOR:
#     - InMemorySerialPort + EhlDispenserEmulator
#     - Ingen fysisk hardware nødvendig
#     - Perfekt for utvikling og testing
#
#   SOCAT:
#     - RealSerialTransport + virtuell PTY (socat)
#     - PLS Simulator på andre enden av PTY
#     - Realistisk serial testing uten hardware
#     - Bruk: ./scripts/start-socat-sim.sh
#
#   HARDWARE (Default for headless):
#     - RealSerialTransport + fysisk RS-485
#     - Kommuniserer med ekte LPG-pumpe
#     - Kun for produksjon på ARK-3600
#
# ═══════════════════════════════════════════════════════════════════════════════
# SERIAL PORT CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
#
# Port name examples:
#   Linux:   /dev/ttyS0, /dev/ttyUSB0, /dev/ttyAMA0 (Raspberry Pi)
#   macOS:   /dev/cu.usbserial-0001 or /tmp/ttyV1 (socat PTY)
#   Windows: COM1, COM3, etc.
#
# Standard EHL Protocol: 9600 baud, 8E1 (8 data bits, Even parity, 1 stop bit)
#
# ═══════════════════════════════════════════════════════════════════════════════
ehl:
  transport:
    # Transport mode: EMULATOR, SOCAT, or HARDWARE
    # HEADLESS DEFAULT: HARDWARE (for production deployment)
    mode: ${EHL_TRANSPORT_MODE:HARDWARE}
  emulator:
    # Legacy property - still works for backwards compatibility
    enabled: ${EHL_EMULATOR_ENABLED:false}
    dispenser-address: ${EHL_DISPENSER_ADDRESS:1}
    price-per-liter-cents: ${EHL_PRICE_CENTS:1590}
    latency-ms: ${EHL_LATENCY_MS:20}
  serial:
    # Serial port device path (for SOCAT and HARDWARE modes)
    port: ${EHL_SERIAL_PORT:/dev/ttyS0}
    # Baud rate (standard EHL: 9600)
    baud-rate: ${EHL_BAUD_RATE:9600}
    # Data bits (5, 6, 7, 8 - standard: 8)
    data-bits: ${EHL_DATA_BITS:8}
    # Parity: NONE, ODD, EVEN, MARK, SPACE (standard EHL: EVEN)
    parity: ${EHL_PARITY:EVEN}
    # Stop bits: 1 or 2 (standard: 1)
    stop-bits: ${EHL_STOP_BITS:1}

# LPG Application Configuration
lpg:
  mode: ${LPG_MODE:LAB}  # LAB (emulator) eller FIELD (ekte hardware) - default LAB for testing
  dispenser:
    address: ${LPG_DISPENSER_ADDRESS:1}  # Dispenser address to poll
  polling:
    interval-ms: ${LPG_POLLING_INTERVAL_MS:2000}  # Poll interval in milliseconds (default 2 seconds)
  price:
    per-liter: ${LPG_PRICE_PER_LITER:15.90}
  station:
    id: ${STATION_ID:STATION-001}
    name: ${STATION_NAME:Test Station}

# Shutdown Configuration
spring.lifecycle:
  timeout-per-shutdown-phase: 30s
