# ═══════════════════════════════════════════════════════════════════════════════
# LPG-EHL HEADLESS - Common Configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# PROFILES:
#   lab        - H2 + emulator (default)
#   field      - Real serial port
#   debug-api  - Enable REST endpoints for curl testing (Undertow web server)
#
# USAGE:
#   LAB:       java -jar lpg-ehl-headless.jar --spring.profiles.active=lab
#   FIELD:     java -jar lpg-ehl-headless.jar --spring.profiles.active=field
#   FIELD+API: java -jar lpg-ehl-headless.jar --spring.profiles.active=field,debug-api
#   LAB+API:   java -jar lpg-ehl-headless.jar --spring.profiles.active=lab,debug-api
#
# DEBUG-API enables REST endpoints for serial diagnostics:
#   - GET  /api/debug/serial/ports          (list ports like 00_list_ports.py)
#   - GET  /api/debug/serial/health         (probe like 01_probe_readonly.py)
#   - POST /api/debug/serial/smart-scan     (find working config)
#   - POST /api/debug/serial/scan-addresses (like 02_scan_addresses.py)
#   - POST /api/debug/serial/auto-detect    (parity detection)
#
# EXTERNAL CONFIG:
#   Override serial params: --spring.config.additional-location=file:./config/
#
# ═══════════════════════════════════════════════════════════════════════════════

spring:
  application:
    name: lpg-ehl-headless
  main:
    web-application-type: none  # No web server by default (debug-api profile enables it)
  
  # Default: H2 in-memory database
  datasource:
    url: jdbc:h2:mem:lpgdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  h2:
    console:
      enabled: false  # Enable via debug-api profile if needed
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

# External services (disabled by default)
azure:
  enabled: ${AZURE_ENABLED:false}
  storage:
    connection-string: ${AZURE_CONNECTION_STRING:UseDevelopmentStorage=true}
    queue-name: ${AZURE_QUEUE_NAME:lpg-transactions}
  sync:
    interval-seconds: ${AZURE_SYNC_INTERVAL:300}
    batch-size: ${AZURE_SYNC_BATCH_SIZE:10}
    max-retries: ${AZURE_SYNC_MAX_RETRIES:3}

nets:
  cloud-connect:
    host: ${NETS_CLOUD_HOST:localhost}
    port: ${NETS_CLOUD_PORT:6001}

# Server (only used when debug-api profile is active)
server:
  port: ${PORT:8080}
  shutdown: graceful

# Logging - INFO som default, DEBUG aktiveres via JVM-flagg
# Eksempel: java -Dlogging.level.no.cloudberries.lpg.protocol=DEBUG -jar ...
logging:
  level:
    root: INFO
    no.cloudberries.lpg: INFO
    org.hibernate.SQL: WARN
    org.springframework: WARN
    liquibase: WARN

# LPG Application
lpg:
  dispenser:
    address: ${LPG_DISPENSER_ADDRESS:1}
  polling:
    interval-ms: ${LPG_POLLING_INTERVAL_MS:2000}
  price:
    per-liter: ${LPG_PRICE_PER_LITER:15.90}
  station:
    id: ${STATION_ID:STATION-001}
    name: ${STATION_NAME:Test Station}

# EHL Serial defaults - bekreftet av Alejandro (2026-02-09)
# /dev/ttyS3, 9600 baud, NONE parity
ehl:
  emulator:
    dispenser-address: ${EHL_DISPENSER_ADDRESS:1}
    price-per-liter-cents: ${EHL_PRICE_CENTS:1590}
    latency-ms: ${EHL_LATENCY_MS:20}
  serial:
    port: ${EHL_SERIAL_PORT:/dev/ttyS3}
    baud-rate: ${EHL_BAUD_RATE:9600}
    data-bits: 8
    parity: ${EHL_SERIAL_PARITY:NONE}
    stop-bits: 1
    read-timeout-ms: 3000
    write-timeout-ms: 1000
  # Retry configuration for RS-485 communication
  # Edge/industrial environments often have transient noise
  retry:
    max-retries: ${EHL_RETRY_MAX:3}
    initial-delay-ms: ${EHL_RETRY_INITIAL_DELAY:100}
    max-delay-ms: ${EHL_RETRY_MAX_DELAY:2000}
    backoff-multiplier: ${EHL_RETRY_BACKOFF:2.0}
