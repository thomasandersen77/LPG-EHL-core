spring:
  application:
    name: lpg-ehl-headless
  main:
    # Web server enabled by default (Undertow)
    web-application-type: servlet
  
  # H2 Persistent Database - DEFAULT
  # Data is stored in ./data/lpgdb.mv.db and persists across restarts
  datasource:
    url: jdbc:h2:file:./data/lpgdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # H2 Console - http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Azure Storage Queue Configuration
azure:
  enabled: ${AZURE_ENABLED:false}  # Default to false for LAB mode testing
  storage:
    connection-string: ${AZURE_CONNECTION_STRING:UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://localhost:10001}
    queue-name: ${AZURE_QUEUE_NAME:lpg-transactions}
  sync:
    interval-seconds: ${AZURE_SYNC_INTERVAL:300}
    batch-size: ${AZURE_SYNC_BATCH_SIZE:10}
    max-retries: ${AZURE_SYNC_MAX_RETRIES:3}

# Nets Cloud Connect Configuration (SSL/TLS Socket)
nets:
  cloud-connect:
    host: ${NETS_CLOUD_HOST:3.33.230.243}
    port: ${NETS_CLOUD_PORT:6001}
    connect-timeout-ms: ${NETS_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${NETS_READ_TIMEOUT_MS:30000}

# ═══════════════════════════════════════════════════════════════════════════════
# LOGGING CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
#
# Default: INFO level - only shows significant events (startup, API calls, errors)
# For protocol debugging, set LOG_LEVEL=DEBUG to see TX/RX traffic and polling status
#
# Environment variables:
#   LOG_LEVEL=DEBUG          - Enable detailed protocol logging
#   LOG_LEVEL_TRANSPORT=DEBUG - Enable only transport layer debugging
#
# ═══════════════════════════════════════════════════════════════════════════════
logging:
  level:
    root: INFO
    no.cloudberries.lpg: ${LOG_LEVEL:INFO}
    no.cloudberries.lpg.headless: ${LOG_LEVEL:INFO}
    no.cloudberries.lpg.headless.service: ${LOG_LEVEL:INFO}
    no.cloudberries.lpg.communication: ${LOG_LEVEL_TRANSPORT:${LOG_LEVEL:INFO}}
    no.cloudberries.lpg.service: ${LOG_LEVEL:INFO}
    no.cloudberries.lpg.protocol: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
    org.springframework: WARN
    liquibase: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{20} - %msg%n"
  file:
    name: ${LOG_FILE:/var/log/lpg-ehl/headless.log}
    max-size: 10MB
    max-history: 30

# ═══════════════════════════════════════════════════════════════════════════════
# EHL SERIAL PORT CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
#
# Port examples:
#   Linux:   /dev/ttyS0, /dev/ttyUSB0, /dev/ttyAMA0 (Raspberry Pi)
#   macOS:   /dev/cu.usbserial-0001
#   Socat:   /tmp/ttyV1 (run ./scripts/start-socat.sh first)
#   Windows: COM1, COM3, etc.
#
# Standard EHL Protocol: 9600 baud, 8E1 (8 data bits, Even parity, 1 stop bit)
#
# ═══════════════════════════════════════════════════════════════════════════════
ehl:
  emulator:
    dispenser-address: ${EHL_DISPENSER_ADDRESS:1}
    price-per-liter-cents: ${EHL_PRICE_CENTS:1590}
    latency-ms: ${EHL_LATENCY_MS:20}
  serial:
    # Serial port device path (for FIELD mode)
    port: ${EHL_SERIAL_PORT:/tmp/ttyV1}
    baud-rate: ${EHL_BAUD_RATE:9600}
    data-bits: ${EHL_DATA_BITS:8}
    parity: ${EHL_PARITY:EVEN}
    stop-bits: ${EHL_STOP_BITS:1}
    read-timeout-ms: 3000
    write-timeout-ms: 1000

# ═══════════════════════════════════════════════════════════════════════════════
# LPG APPLICATION CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
#
# TWO MODES:
#   LAB (default):  Uses in-memory emulator - no hardware needed
#   FIELD:          Uses real serial port (hardware or socat PTY)
#
# For FIELD mode with socat testing:
#   1. Run: ./scripts/start-socat.sh
#   2. Start app with: --lpg.mode=FIELD --ehl.serial.port=/tmp/ttyV1
#
# ═══════════════════════════════════════════════════════════════════════════════
lpg:
  mode: ${LPG_MODE:LAB}  # LAB (emulator) or FIELD (real serial)
  dispenser:
    address: ${LPG_DISPENSER_ADDRESS:1}
  polling:
    interval-ms: ${LPG_POLLING_INTERVAL_MS:2000}
  price:
    per-liter: ${LPG_PRICE_PER_LITER:15.90}
  station:
    id: ${STATION_ID:STATION-001}
    name: ${STATION_NAME:Test Station}

# Web Server Configuration
server:
  port: ${PORT:8080}
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s
