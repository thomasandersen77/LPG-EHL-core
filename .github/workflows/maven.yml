# .github/workflows/maven.yml

name: Java CI with Maven and Anthropic PR Review

on:
  workflow_dispatch:
  pull_request:
    # Kjører kun når en pull request mot main opprettes eller oppdateres
    branches: [ "main" ]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [21, 25]
    # No working-directory needed - Maven multi-module build from root
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn -B verify

  review:
    name: Perform Anthropic Code Reviews
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pull-requests: write
    # No working-directory needed - reviews are at repo root level
    strategy:
      matrix:
        review_type: [architecture, security, readability]
        include:
          - review_type: architecture
            prompt_file: .github/prompts/architecture_review_prompt.txt
            output_file: anthropic_review_arch.txt
          - review_type: security
            prompt_file: .github/prompts/security_review_prompt.txt
            output_file: anthropic_review_sec.txt
          - review_type: readability
            prompt_file: .github/prompts/readability_review_prompt.txt
            output_file: anthropic_review_readability.txt
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run ${{ matrix.review_type }} review
        uses: ./.github/actions/gemini-review
        with:
          review_type: ${{ matrix.review_type }}
          prompt_file: ${{ matrix.prompt_file }}
          output_file: ${{ matrix.output_file }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Post ${{ matrix.review_type }} review comment
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const reviewPath = path.join(process.env.GITHUB_WORKSPACE, '${{ matrix.output_file }}');
            if (!fs.existsSync(reviewPath)) {
              core.info('Review file not found, skipping comment.');
              return;
            }
            const review = fs.readFileSync(reviewPath, 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🤖 Anthropic Claude ${{ matrix.review_type }} Review\n\n${review}`
            });
