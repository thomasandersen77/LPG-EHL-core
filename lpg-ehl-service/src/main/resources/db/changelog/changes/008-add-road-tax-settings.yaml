databaseChangeLog:
  - changeSet:
      id: 008-add-road-tax-settings-table
      author: warp-ai
      changes:
        - createTable:
            tableName: road_tax_settings
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: RANDOM_UUID()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tax_per_liter_ore
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: effective_from
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: effective_until
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(100)
                  constraints:
                    nullable: true
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: true
        - createIndex:
            indexName: idx_road_tax_effective_from
            tableName: road_tax_settings
            columns:
              - column:
                  name: effective_from
                  descending: true
        - sql:
            sql: "INSERT INTO road_tax_settings (tax_per_liter_ore, effective_from, created_by, description) VALUES (200, CURRENT_TIMESTAMP, 'system', 'Veitrafikkavgift 2026 - Initial default')"
            comment: "Initialize with default Norwegian road tax rate (2.00 kr/L)"

  - changeSet:
      id: 008-add-road-tax-to-transactions
      author: warp-ai
      changes:
        - addColumn:
            tableName: transactions
            columns:
              - column:
                  name: road_tax_per_liter_ore
                  type: integer
                  defaultValue: 0
                  constraints:
                    nullable: true
        - sql:
            dbms: postgresql
            sql: "COMMENT ON COLUMN transactions.road_tax_per_liter_ore IS 'Road tax per liter in øre at time of transaction'"
