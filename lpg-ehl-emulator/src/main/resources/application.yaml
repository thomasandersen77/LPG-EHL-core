server:
  port: ${PORT:9001}

spring:
  application:
    name: lpg-ehl-edge
  # Static resources (React frontend)
  web:
    resources:
      static-locations: classpath:/static/

emulator:
  address: ${EMULATOR_ADDRESS:1}
  price-per-litre-cents: ${EMULATOR_PRICE_PER_LITRE_CENTS:1590}
  litres-per-second: ${EMULATOR_LITRES_PER_SECOND:0.5}
  port: ${EMULATOR_PORT:9000}

lpg-api:
  base-url: ${LPG_API_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    no.cloudberries.lpg: INFO
