# Production Profile for Emulator on Render
# Note: server.port is set via JAVA_TOOL_OPTIONS in render.yaml

spring:
  application:
    name: lpg-ehl-emulator

emulator:
  address: ${EMULATOR_ADDRESS:1}
  price-per-litre-cents: ${EMULATOR_PRICE_PER_LITRE_CENTS:1590}
  litres-per-second: ${EMULATOR_LITRES_PER_SECOND:0.5}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    no.cloudberries.lpg: INFO
