# ═══════════════════════════════════════════════════════════════════════════════
# LAB PROFILE - Development & Testing with Emulator
# ═══════════════════════════════════════════════════════════════════════════════
#
# Start with: java -jar lpg-ehl-webapp.jar --spring.profiles.active=lab
#
# Features:
#   - H2 in-memory database (resets on restart)
#   - Built-in EHL protocol emulator (no hardware needed)
#   - H2 console at /h2-console
#   - Azure sync disabled
#   - Full debug logging
#
# ═══════════════════════════════════════════════════════════════════════════════

spring:
  # H2 In-Memory Database
  datasource:
    url: jdbc:h2:mem:lpgdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none  # Liquibase manages schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # H2 Console for debugging
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  liquibase:
    enabled: true

# External services disabled for offline testing
azure:
  enabled: false

nets:
  cloud-connect:
    host: localhost
    port: 6001

# Logging - verbose for development
logging:
  level:
    root: INFO
    no.cloudberries.lpg: INFO
    no.cloudberries.lpg.communication: DEBUG
    no.cloudberries.lpg.protocol: DEBUG
    no.cloudberries.lpg.emulator: INFO
    org.hibernate.SQL: WARN
    org.springframework: WARN
    liquibase: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%15.15thread] %logger{25} - %msg%n"
