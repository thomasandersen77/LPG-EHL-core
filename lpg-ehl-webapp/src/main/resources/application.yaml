spring:
  application:
    name: lpg-ehl-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lpg_ehl}
    username: ${DB_USER:lpg_user}
    password: ${DB_PASSWORD:lpg_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    liquibase-schema: public
    drop-first: false
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Azure Storage Queue Configuration
azure:
  enabled: ${AZURE_ENABLED:true}
  storage:
    connection-string: ${AZURE_CONNECTION_STRING:UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://localhost:10001}
    queue-name: ${AZURE_QUEUE_NAME:lpg-transactions}
  sync:
    interval-seconds: ${AZURE_SYNC_INTERVAL:300}
    batch-size: ${AZURE_SYNC_BATCH_SIZE:10}
    max-retries: ${AZURE_SYNC_MAX_RETRIES:3}

# Nets Cloud Connect Configuration (SSL/TLS Socket)
# No configuration needed in application.yaml - CloudTerminalClient is configured in code
# Connection parameters: 3.33.230.243:6001 (SSL/TLS)
# Protocol: Baxi (same as direct TCP/ECR)
nets:
  cloud-connect:
    # Optional overrides (defaults in CloudTerminalClient)
    host: ${NETS_CLOUD_HOST:3.33.230.243}
    port: ${NETS_CLOUD_PORT:6001}
    connect-timeout-ms: ${NETS_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${NETS_READ_TIMEOUT_MS:30000}

# Security Configuration
security:
  api-token: ${API_AUTH_TOKEN:dev-token-12345}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:8080}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Logging
logging:
  level:
    root: INFO
    no.cloudberries.lpg: INFO
    no.cloudberries.lpg.api.controller: INFO
    no.cloudberries.lpg.api.config.TokenAuthenticationFilter: WARN
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Server Configuration
server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

# ═══════════════════════════════════════════════════════════════════════════════
# EHL PROTOCOL CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
# 
# DUAL-MODE ARKITEKTUR:
#   LAB MODE  (ehl.emulator.enabled=true)  -> Emulator, ingen fysisk hardware
#   FIELD MODE (ehl.emulator.enabled=false) -> Ekte serial port til pumpe
#
# DEFAULT: LAB MODE (trygt for utvikling)
# ═══════════════════════════════════════════════════════════════════════════════
ehl:
  emulator:
    enabled: ${EHL_EMULATOR_ENABLED:true}  # DEFAULT: LAB MODE (sikkert)
    dispenser-address: ${EHL_DISPENSER_ADDRESS:1}
    price-per-liter-cents: ${EHL_PRICE_CENTS:1590}
    latency-ms: ${EHL_LATENCY_MS:20}  # Simulert serial port latency
  serial:
    port: ${EHL_SERIAL_PORT:/dev/ttyS0}  # Kun brukt når enabled=false
    baud-rate: ${EHL_BAUD_RATE:9600}
    data-bits: 8
    parity: EVEN  # 8E1 (8 data bits, even parity, 1 stop bit)
    stop-bits: 1
