# ═══════════════════════════════════════════════════════════════════════════════
# LPG-EHL WEBAPP - Unified Configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# DATABASE: H2 file-basert (./data/lpgdb) - persisterer data
# SERIAL:   Konfigurerbart via kommandolinje
#
# BRUK:
#   java -jar lpg-ehl-webapp.jar
#   java -jar lpg-ehl-webapp.jar --ehl.serial.port=/tmp/vserial1
#   java -jar lpg-ehl-webapp.jar --ehl.serial.port=/dev/ttyS3
#
# EKSTERN KONFIG (valgfritt):
#   java -jar lpg-ehl-webapp.jar --spring.config.additional-location=file:./config/
#
# ═══════════════════════════════════════════════════════════════════════════════

spring:
  application:
    name: lpg-ehl-webapp
  
  # H2 File Database - persisterer data mellom restarts
  datasource:
    url: jdbc:h2:file:./data/lpgdb;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Azure Storage Queue (deaktivert som standard)
azure:
  enabled: ${AZURE_ENABLED:false}
  storage:
    connection-string: ${AZURE_CONNECTION_STRING:UseDevelopmentStorage=true}
    queue-name: ${AZURE_QUEUE_NAME:lpg-transactions}
  sync:
    interval-seconds: ${AZURE_SYNC_INTERVAL:300}
    batch-size: ${AZURE_SYNC_BATCH_SIZE:10}
    max-retries: ${AZURE_SYNC_MAX_RETRIES:3}

# Nets Cloud Connect
nets:
  cloud-connect:
    host: ${NETS_CLOUD_HOST:localhost}
    port: ${NETS_CLOUD_PORT:6001}
    connect-timeout-ms: ${NETS_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${NETS_READ_TIMEOUT_MS:30000}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Server
server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

# Payment Terminal (for diagnostics page)
payment:
  terminal:
    enabled: ${PAYMENT_TERMINAL_ENABLED:false}
    base-url: ${PAYMENT_TERMINAL_BASE_URL:http://localhost:18080}

# Logging
logging:
  level:
    root: INFO
    no.cloudberries.lpg: INFO
    no.cloudberries.lpg.service.terminal: DEBUG
    no.cloudberries.lpg.api.controller.PaymentTerminalDiagController: DEBUG
    org.hibernate.SQL: WARN
    org.springframework: WARN
    liquibase: WARN

# ═══════════════════════════════════════════════════════════════════════════════
# LPG APPLIKASJON
# ═══════════════════════════════════════════════════════════════════════════════
lpg:
  dispenser:
    address: ${LPG_DISPENSER_ADDRESS:1}
  polling:
    interval-ms: ${LPG_POLLING_INTERVAL_MS:2000}
  price:
    per-liter: ${LPG_PRICE_PER_LITER:15.90}
  station:
    id: ${STATION_ID:STATION-001}
    name: ${STATION_NAME:Test Station}

# ═══════════════════════════════════════════════════════════════════════════════
# EHL SERIELL KOMMUNIKASJON
# Standard: 9600 baud, 8N1 (NONE parity)
# ═══════════════════════════════════════════════════════════════════════════════
ehl:
  emulator:
    dispenser-address: ${EHL_DISPENSER_ADDRESS:1}
    price-per-liter-cents: ${EHL_PRICE_CENTS:1590}
    latency-ms: ${EHL_LATENCY_MS:20}
  serial:
    port: ${EHL_SERIAL_PORT:/dev/ttyS3}
    baud-rate: ${EHL_BAUD_RATE:9600}
    data-bits: 8
    parity: ${EHL_SERIAL_PARITY:NONE}
    stop-bits: 1
    read-timeout-ms: 3000
    write-timeout-ms: 1000
