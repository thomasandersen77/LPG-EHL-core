# ═══════════════════════════════════════════════════════════════════════════════
# LPG-EHL WEBAPP - Common Configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# PROFILES:
#   lab   - Development with H2 + emulator (default)
#   field - Production with real serial port
#
# USAGE:
#   LAB:   java -jar lpg-ehl-webapp.jar --spring.profiles.active=lab
#   FIELD: java -jar lpg-ehl-webapp.jar --spring.profiles.active=field
#
# EXTERNAL CONFIG:
#   Override serial params in config/application.yaml:
#   --spring.config.additional-location=file:./config/
#
# ═══════════════════════════════════════════════════════════════════════════════

spring:
  application:
    name: lpg-ehl-webapp
  security:
    user:
      name: ${SECURITY_USER_NAME:admin}
      password: ${SECURITY_USER_PASSWORD:admin123}
  
  # Default: H2 in-memory (overridden by profiles or external config)
  datasource:
    url: jdbc:h2:mem:lpgdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Azure Storage Queue Configuration (disabled by default, override in profiles)
azure:
  enabled: ${AZURE_ENABLED:false}
  storage:
    connection-string: ${AZURE_CONNECTION_STRING:UseDevelopmentStorage=true}
    queue-name: ${AZURE_QUEUE_NAME:lpg-transactions}
  sync:
    interval-seconds: ${AZURE_SYNC_INTERVAL:300}
    batch-size: ${AZURE_SYNC_BATCH_SIZE:10}
    max-retries: ${AZURE_SYNC_MAX_RETRIES:3}

# Nets Cloud Connect
nets:
  cloud-connect:
    host: ${NETS_CLOUD_HOST:localhost}
    port: ${NETS_CLOUD_PORT:6001}
    connect-timeout-ms: ${NETS_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${NETS_READ_TIMEOUT_MS:30000}

# Security
security:
  api-token: ${API_AUTH_TOKEN:dev-token-12345}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:8080,http://localhost:5173}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Server
server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

# Logging - INFO som default, DEBUG aktiveres via JVM-flagg
# Eksempel: java -Dlogging.level.no.cloudberries.lpg.protocol=DEBUG -jar ...
logging:
  level:
    root: INFO
    no.cloudberries.lpg: INFO
    org.hibernate.SQL: WARN
    org.springframework: WARN
    liquibase: WARN

# ═══════════════════════════════════════════════════════════════════════════════
# LPG APPLICATION CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
lpg:
  dispenser:
    address: ${LPG_DISPENSER_ADDRESS:1}
  polling:
    interval-ms: ${LPG_POLLING_INTERVAL_MS:2000}
  price:
    per-liter: ${LPG_PRICE_PER_LITER:15.90}
  station:
    id: ${STATION_ID:STATION-001}
    name: ${STATION_NAME:Test Station}

# ═══════════════════════════════════════════════════════════════════════════════
# EHL SERIAL DEFAULTS - bekreftet av Alejandro (2026-02-09)
# /dev/ttyS3, 9600 baud, NONE parity (8N1)
# ═══════════════════════════════════════════════════════════════════════════════
ehl:
  emulator:
    dispenser-address: ${EHL_DISPENSER_ADDRESS:1}
    price-per-liter-cents: ${EHL_PRICE_CENTS:1590}
    latency-ms: ${EHL_LATENCY_MS:20}
  serial:
    port: ${EHL_SERIAL_PORT:/dev/ttyS3}
    baud-rate: ${EHL_BAUD_RATE:9600}
    data-bits: 8
    parity: ${EHL_SERIAL_PARITY:NONE}
    stop-bits: 1
    read-timeout-ms: 3000
    write-timeout-ms: 1000
