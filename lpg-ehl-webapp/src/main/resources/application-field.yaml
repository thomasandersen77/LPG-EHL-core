# ═══════════════════════════════════════════════════════════════════════════════
# FIELD PROFILE - Production / Real Hardware
# ═══════════════════════════════════════════════════════════════════════════════
#
# Start with: java -jar lpg-ehl-webapp.jar --spring.profiles.active=field
#
# For SOCAT testing (virtual PTY):
#   1. Run: ./scripts/start-socat-sim.sh
#   2. Start app with: --spring.profiles.active=field
#   3. Override serial port via config/application.yaml or CLI
#
# For real hardware:
#   1. Connect RS-485 adapter
#   2. Configure serial port in config/application.yaml:
#      ehl:
#        serial:
#          port: /dev/ttyUSB0
#          parity: EVEN
#
# ═══════════════════════════════════════════════════════════════════════════════

spring:
  # H2 In-Memory Database (use config/application.yaml for PostgreSQL)
  datasource:
    url: jdbc:h2:mem:lpgdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  liquibase:
    enabled: true

# External services (override via config/application.yaml for production)
azure:
  enabled: ${AZURE_ENABLED:false}

nets:
  cloud-connect:
    host: ${NETS_CLOUD_HOST:localhost}
    port: ${NETS_CLOUD_PORT:6001}

# ═══════════════════════════════════════════════════════════════════════════════
# SERIAL PORT DEFAULTS (override in config/application.yaml)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Standard EHL Protocol: 9600 baud, 8E1 (8 data bits, Even parity, 1 stop bit)
# For PLS Simulator:     9600 baud, 8N1 (8 data bits, No parity, 1 stop bit)
#
# ═══════════════════════════════════════════════════════════════════════════════
ehl:
  serial:
    port: ${EHL_SERIAL_PORT:/tmp/vserial1}
    baud-rate: ${EHL_BAUD_RATE:9600}
    data-bits: 8
    parity: ${EHL_SERIAL_PARITY:NONE}  # NONE for simulator, EVEN for hardware
    stop-bits: 1
    read-timeout-ms: 3000
    write-timeout-ms: 1000

# Logging - production level
logging:
  level:
    root: INFO
    no.cloudberries.lpg: INFO
    no.cloudberries.lpg.communication: INFO
    no.cloudberries.lpg.protocol: INFO
    org.hibernate.SQL: WARN
    org.springframework: WARN
    liquibase: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%15.15thread] %logger{25} - %msg%n"
