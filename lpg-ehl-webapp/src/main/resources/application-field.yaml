# ═══════════════════════════════════════════════════════════════════════════════
# FIELD PROFILE - Production / Real Hardware
# ═══════════════════════════════════════════════════════════════════════════════
#
# Start: java -jar lpg-ehl-webapp.jar --spring.profiles.active=field
#
# Features:
#   - H2 file-basert database (./data/lpgdb) - persisterer data
#   - NONE parity (8N1) - bekreftet av Alejandro
#   - H2 console på /h2-console
#   - INFO logging
#
# Serial port override (for SOCAT simulator):
#   --ehl.serial.port=/tmp/vserial1
#
# ═══════════════════════════════════════════════════════════════════════════════

spring:
  # H2 File Database - persisterer data mellom restarts
  datasource:
    url: jdbc:h2:file:./data/lpgdb;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  liquibase:
    enabled: true

# External services
azure:
  enabled: ${AZURE_ENABLED:false}

nets:
  cloud-connect:
    host: ${NETS_CLOUD_HOST:localhost}
    port: ${NETS_CLOUD_PORT:6001}

# Serial defaults - bekreftet av Alejandro (2026-02-09)
ehl:
  emulator:
    enabled: false
  serial:
    port: ${EHL_SERIAL_PORT:/dev/ttyS3}
    baud-rate: ${EHL_BAUD_RATE:9600}
    data-bits: 8
    parity: ${EHL_SERIAL_PARITY:NONE}
    stop-bits: 1
    read-timeout-ms: 3000
    write-timeout-ms: 1000

# INFO logging for production
logging:
  level:
    no.cloudberries.lpg: INFO
