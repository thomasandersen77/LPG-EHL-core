# ═══════════════════════════════════════════════════════════════════════════════
# TERMINAL-SIM PROFIL – Aktiverer kobling til Payment Terminal Simulator
# ═══════════════════════════════════════════════════════════════════════════════
# Bruk sammen med field: --spring.profiles.active=field,terminal-sim
#
# Når aktiv: TerminalEventPoller poller /v1/events, ved reservation success
# sender UNBLOCK til pumpen. PLS simulator kan da starte fylling via START-knappen.
# ═══════════════════════════════════════════════════════════════════════════════

payment:
  terminal:
    enabled: true
    base-url: ${PAYMENT_TERMINAL_BASE_URL:http://192.168.0.9:18080}
