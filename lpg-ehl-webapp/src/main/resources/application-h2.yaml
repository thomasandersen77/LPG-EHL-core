spring:
  application:
    name: lpg-ehl-api
  profiles:
    active: h2
  
  # H2 In-Memory Database Configuration
  datasource:
    url: jdbc:h2:mem:lpgdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # H2 Console (optional - for debugging)
  h2:
    console:
      enabled: true
      path: /h2-console
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

# Azure Storage Queue Configuration (disabled for H2 testing)
azure:
  enabled: false

# Nets Cloud Connect Configuration (disabled for H2 testing)
nets:
  cloud-connect:
    host: localhost
    port: 6001

# Security Configuration
security:
  api-token: ${API_AUTH_TOKEN:dev-token-12345}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:8080}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

# API Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ═══════════════════════════════════════════════════════════════════════════════
# LOGGING CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
logging:
  level:
    root: INFO
    no.cloudberries.lpg: INFO
    no.cloudberries.lpg.api: INFO
    no.cloudberries.lpg.communication: INFO
    org.hibernate.SQL: WARN
    org.springframework: WARN
    liquibase: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{20} - %msg%n"
  file:
    name: /tmp/lpg-ehl/webapp.log
    max-size: 10MB
    max-history: 30

# Server Configuration
server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

# ═══════════════════════════════════════════════════════════════════════════════
# EHL PROTOCOL CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
# 
# TRI-MODE ARKITEKTUR (ehl.transport.mode):
#
#   EMULATOR (Default):
#     - InMemorySerialPort + EhlDispenserEmulator
#     - Ingen fysisk hardware nødvendig
#     - Perfekt for utvikling og testing
#
#   SOCAT:
#     - RealSerialTransport + virtuell PTY (socat)
#     - PLS Simulator på andre enden av PTY
#     - Realistisk serial testing uten hardware
#     - Bruk: ./scripts/start-socat-sim.sh
#
#   HARDWARE:
#     - RealSerialTransport + fysisk RS-485
#     - Kommuniserer med ekte LPG-pumpe
#     - Kun for produksjon på ARK-3600
#
# ═══════════════════════════════════════════════════════════════════════════════
ehl:
  transport:
    # Transport mode: EMULATOR, SOCAT, or HARDWARE
    mode: ${EHL_TRANSPORT_MODE:EMULATOR}
  emulator:
    enabled: ${EHL_EMULATOR_ENABLED:true}
    dispenser-address: ${EHL_DISPENSER_ADDRESS:1}
    price-per-liter-cents: ${EHL_PRICE_CENTS:1590}
    latency-ms: ${EHL_LATENCY_MS:20}
  serial:
    # Serial port device path (for SOCAT and HARDWARE modes)
    port: ${EHL_SERIAL_PORT:/tmp/ttyV1}
    baud-rate: ${EHL_BAUD_RATE:9600}
    data-bits: 8
    parity: EVEN
    stop-bits: 1
