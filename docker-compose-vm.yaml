# Docker Compose for Windows VM Dispenser Testing
# This configuration is optimized for testing with real Windows VM Dispenserkontroll
# 
# Prerequisites:
# 1. Windows VM running with Dispenserkontroll program
# 2. VM accessible from Mac (bridged network or port forwarding)
# 3. Serial port or network connection to dispenser configured in VM
#
# Run: docker-compose -f docker-compose-vm.yaml up

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: lpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lpg_ehl
      POSTGRES_USER: lpg_user
      POSTGRES_PASSWORD: lpg_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpg_user -d lpg_ehl"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lpg-network

  # Azurite - Azure Storage Emulator
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: lpg-azurite
    restart: unless-stopped
    command: "azurite-queue --queueHost 0.0.0.0 --queuePort 10001 --loose --location /data"
    ports:
      - "10001:10001"
    volumes:
      - azurite-data:/data
    networks:
      - lpg-network

  # LPG-EHL API (connects to Windows VM)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: lpg-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local,demo
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: lpg_ehl
      DB_USER: lpg_user
      DB_PASSWORD: lpg_dev_password
      
      # Azure Configuration
      AZURE_ENABLED: true
      AZURE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;"
      AZURE_QUEUE_NAME: lpg-transactions
      AZURE_SYNC_INTERVAL: 30
      AZURE_SYNC_BATCH_SIZE: 10
      AZURE_SYNC_MAX_RETRIES: 3
      
      # Security
      API_AUTH_TOKEN: dev-token-12345
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      
      # Windows VM Dispenser Connection
      # Use host.docker.internal to connect from Docker container to Mac host
      # Then Mac forwards to Windows VM
      DISPENSER_HOST: host.docker.internal
      DISPENSER_PORT: 9000
      
      # Nets Cloud Connect (disabled for now)
      NETS_CLOUD_ENABLED: false
      
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - lpg-network

  # Frontend - React Web UI
  frontend:
    build:
      context: ./lpg-web
      dockerfile: Dockerfile
    container_name: lpg-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    networks:
      - lpg-network

  # WireMock - Mock Nets Cloud Connect API for testing
  wiremock:
    image: wiremock/wiremock:3.3.1
    container_name: lpg-wiremock
    restart: unless-stopped
    command:
      - --global-response-templating
      - --verbose
    ports:
      - "8082:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
      - ./wiremock/__files:/home/wiremock/__files
    networks:
      - lpg-network

networks:
  lpg-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  azurite-data:
    driver: local

# ============================================================================
# Windows VM Testing Guide
# ============================================================================
#
# Setup Steps:
#
# 1. START WINDOWS VM
#    - Start VM with Dispenserkontroll program
#    - Verify dispenser is connected via serial port or network
#    - Note the IP address and port where Dispenserkontroll listens
#
# 2. CONFIGURE PORT FORWARDING (if needed)
#    - In VM settings, forward port 9000 to Mac host
#    - Or use bridged networking for direct access
#
# 3. TEST CONNECTION FROM MAC
#    - Test connectivity: nc -v <VM_IP> 9000
#    - Or: telnet <VM_IP> 9000
#
# 4. START DOCKER STACK
#    - docker-compose -f docker-compose-vm.yaml up
#    - Watch logs: docker-compose -f docker-compose-vm.yaml logs -f api
#
# 5. ACCESS FRONTEND
#    - Open browser: http://localhost:3000
#    - Monitor transactions from real dispenser
#
# Access Points:
#   - Frontend:  http://localhost:3000
#   - API:       http://localhost:8080
#   - Swagger:   http://localhost:8080/swagger-ui.html
#   - Database:  localhost:5432 (user: lpg_user, password: lpg_dev_password)
#   - Azurite:   localhost:10001
#   - WireMock:  http://localhost:8082 (Mock Nets API)
#
# Troubleshooting:
#
# - If API can't connect to VM:
#   Check: docker-compose -f docker-compose-vm.yaml logs api | grep -i dispenser
#   Fix: Verify DISPENSER_HOST and DISPENSER_PORT in environment above
#
# - If VM not accessible:
#   Test: ping <VM_IP>
#   Test: nc -v <VM_IP> 9000
#   Fix: Check VM network settings (bridged vs NAT)
#
# - View all logs:
#   docker-compose -f docker-compose-vm.yaml logs -f
#
# - Restart API only:
#   docker-compose -f docker-compose-vm.yaml restart api
#
# - Stop everything:
#   docker-compose -f docker-compose-vm.yaml down
