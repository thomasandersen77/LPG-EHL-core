version: '3.8'

services:
  # ============================================================================
  # STATION S001 - Drammen Sentrum
  # ============================================================================
  edge-s001:
    build:
      context: ./lpg-ehl-emulator
      dockerfile: Dockerfile
    container_name: edge-s001
    environment:
      # Multi-Station Identifiers
      - STATION_ID=S001
      - EDGE_ID=EDGE-S001-01
      - DISPENSER_ID=D001
      
      # Emulator Configuration
      - emulator.address=1
      - emulator.port=9000
      - emulator.price-per-litre-cents=1590  # 15.90 kr/L
      - emulator.litres-per-second=0.5
      
      # Cloud Integration
      - lpg-api.base-url=http://minlpg-backend:8081
      
      # Heartbeat Configuration
      - heartbeat.enabled=true
      - heartbeat.interval-seconds=30
      
      # Spring Boot
      - SPRING_PROFILES_ACTIVE=docker
      
    ports:
      - "9001:9000"  # Legacy TCP for Windows Dispenserkontroll
      - "8091:8080"  # REST API
    networks:
      - lpg-network
    depends_on:
      - minlpg-backend
    restart: unless-stopped
    labels:
      station: "S001"
      location: "Drammen Sentrum"

  # ============================================================================
  # STATION S002 - Oslo Vest
  # ============================================================================
  edge-s002:
    build:
      context: ./lpg-ehl-emulator
      dockerfile: Dockerfile
    container_name: edge-s002
    environment:
      # Multi-Station Identifiers
      - STATION_ID=S002
      - EDGE_ID=EDGE-S002-01
      - DISPENSER_ID=D001
      
      # Emulator Configuration
      - emulator.address=1
      - emulator.port=9000
      - emulator.price-per-litre-cents=1620  # 16.20 kr/L (slightly different price)
      - emulator.litres-per-second=0.5
      
      # Cloud Integration
      - lpg-api.base-url=http://minlpg-backend:8081
      
      # Heartbeat Configuration
      - heartbeat.enabled=true
      - heartbeat.interval-seconds=30
      
      # Spring Boot
      - SPRING_PROFILES_ACTIVE=docker
      
    ports:
      - "9002:9000"  # Legacy TCP
      - "8092:8080"  # REST API
    networks:
      - lpg-network
    depends_on:
      - minlpg-backend
    restart: unless-stopped
    labels:
      station: "S002"
      location: "Oslo Vest"

  # ============================================================================
  # STATION S003 - Trondheim Lade
  # ============================================================================
  edge-s003:
    build:
      context: ./lpg-ehl-emulator
      dockerfile: Dockerfile
    container_name: edge-s003
    environment:
      # Multi-Station Identifiers
      - STATION_ID=S003
      - EDGE_ID=EDGE-S003-01
      - DISPENSER_ID=D001
      
      # Emulator Configuration
      - emulator.address=1
      - emulator.port=9000
      - emulator.price-per-litre-cents=1580  # 15.80 kr/L
      - emulator.litres-per-second=0.5
      
      # Cloud Integration
      - lpg-api.base-url=http://minlpg-backend:8081
      
      # Heartbeat Configuration
      - heartbeat.enabled=true
      - heartbeat.interval-seconds=30
      
      # Spring Boot
      - SPRING_PROFILES_ACTIVE=docker
      
    ports:
      - "9003:9000"  # Legacy TCP
      - "8093:8080"  # REST API
    networks:
      - lpg-network
    depends_on:
      - minlpg-backend
    restart: unless-stopped
    labels:
      station: "S003"
      location: "Trondheim Lade"

  # ============================================================================
  # CLOUD BACKEND (from MinLPG)
  # ============================================================================
  minlpg-backend:
    image: minlpg-backend:latest
    container_name: minlpg-backend
    environment:
      - DB_HOST=minlpg-db
      - DB_PORT=5432
      - DB_NAME=minlpg
      - DB_USER=minlpg_user
      - DB_PASSWORD=minlpg_password
    ports:
      - "8081:8081"
    networks:
      - lpg-network
    depends_on:
      - minlpg-db
    restart: unless-stopped

  # ============================================================================
  # DATABASE
  # ============================================================================
  minlpg-db:
    image: postgres:16-alpine
    container_name: minlpg-db
    environment:
      - POSTGRES_DB=minlpg
      - POSTGRES_USER=minlpg_user
      - POSTGRES_PASSWORD=minlpg_password
    ports:
      - "5433:5432"
    volumes:
      - minlpg-db-data:/var/lib/postgresql/data
    networks:
      - lpg-network
    restart: unless-stopped

networks:
  lpg-network:
    driver: bridge
    name: lpg-network

volumes:
  minlpg-db-data:
    name: minlpg-db-data
