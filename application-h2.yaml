# ═══════════════════════════════════════════════════════════════════════════════
# LPG EHL - External Configuration for Field Deployment
# ═══════════════════════════════════════════════════════════════════════════════
#
# VIKTIG: Denne filen er UTENFOR JAR og brukes kun i FIELD mode for å overstyre
# serielle parametre. Plasseres i deploy-katalogen på target hardware.
#
# ═══════════════════════════════════════════════════════════════════════════════
# PROFILES (Spring Profiles)
# ═══════════════════════════════════════════════════════════════════════════════
#
# LAB (default - in-memory emulator):
#   ./scripts/run-lab.sh webapp           # Full GUI + emulator
#   ./scripts/run-lab.sh headless --api   # CLI + debug REST API
#
# FIELD (ekte serial port eller socat):
#   ./scripts/run-field.sh webapp         # GUI + serial port
#   ./scripts/run-field.sh headless       # CLI + serial port
#
# For socat testing, start først:
#   ./scripts/start-socat-sim.sh
#
# ═══════════════════════════════════════════════════════════════════════════════
# EXTERNAL OVERRIDE
# ═══════════════════════════════════════════════════════════════════════════════
#
# Denne filen lastes med --spring.config.additional-location for å overstyre
# serial port parametre i felt uten å måtte rebuilde JAR.
#
# Eksempel:
#   java -jar lpg-ehl-webapp.jar \
#     --spring.profiles.active=field \
#     --spring.config.additional-location=file:./application-h2.yaml
#
# ═══════════════════════════════════════════════════════════════════════════════

spring:
  application:
    name: lpg-ehl
  security:
    user:
      name: admin
      password: admin123
  
  # H2 In-Memory Database Configuration
  # Data is reset on restart - perfect for testing
  datasource:
    url: jdbc:h2:mem:lpgdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # H2 Console - http://localhost:8080/h2-console (webapp only)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

# ═══════════════════════════════════════════════════════════════════════════════
# EXTERNAL SERVICES (disabled for offline testing)
# ═══════════════════════════════════════════════════════════════════════════════
azure:
  enabled: false

nets:
  cloud-connect:
    host: localhost
    port: 6001

# ═══════════════════════════════════════════════════════════════════════════════
# WEBAPP CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
security:
  api-token: ${API_AUTH_TOKEN:dev-token-12345}
  cors:
    allowed-origins: http://localhost:3001,http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${PORT:8080}
  shutdown: graceful

# ═══════════════════════════════════════════════════════════════════════════════
# LOGGING CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
# 
# Nivåer: ERROR < WARN < INFO < DEBUG < TRACE
#
# For detaljert protokoll-logging, sett:
#   no.cloudberries.lpg.communication: DEBUG
#   no.cloudberries.lpg.protocol: DEBUG
#
# ═══════════════════════════════════════════════════════════════════════════════
logging:
  level:
    root: INFO
    no.cloudberries.lpg: INFO
    no.cloudberries.lpg.communication: DEBUG    # TX/RX bytes
    no.cloudberries.lpg.protocol: DEBUG         # EHL packet parsing
    no.cloudberries.lpg.emulator: INFO          # Emulator events
    org.hibernate.SQL: WARN
    org.springframework: WARN
    liquibase: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%15.15thread] %logger{25} - %msg%n"
  file:
    name: ./logs/lpg-ehl.log
    max-size: 10MB
    max-history: 30

# ═══════════════════════════════════════════════════════════════════════════════
# SERIAL PORT CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
# 
# Standard EHL Protocol: 9600 baud, 8E1 (8 data bits, Even parity, 1 stop bit)
#
# ⚠️ VIKTIG: Simulator og Python bruker 8N1 (no parity)
#   For testing mot simulator: parity: NONE
#   For ekte hardware: parity: EVEN (verifiser med Python først!)
#
# Common port paths:
#   Linux:   /dev/ttyS0, /dev/ttyUSB0, /dev/ttyAMA0 (Raspberry Pi)
#   macOS:   /dev/cu.usbserial-xxxx, /tmp/vserial1 (socat PTY)
#   Windows: COM1, COM3, etc.
#
# Parity options: NONE, EVEN, ODD, MARK, SPACE
#
# ═══════════════════════════════════════════════════════════════════════════════
ehl:
  transport:
    # LEGACY: Denne brukes ikke lenger, bruk lpg.mode i stedet
    # Beholdes for bakoverkompatibilitet
    mode: ${EHL_TRANSPORT_MODE:EMULATOR}
  
  serial:
    # Serial port device path
    port: ${EHL_SERIAL_PORT:/tmp/vserial1}
    baud-rate: ${EHL_BAUD_RATE:9600}
    data-bits: 8
    # VIKTIG: NONE for simulator/Python, EVEN for ekte hardware (default)
    parity: ${EHL_SERIAL_PARITY:EVEN}
    stop-bits: 1
    # Timeouts (ms)
    read-timeout-ms: 3000
    write-timeout-ms: 1000
  
  emulator:
    # Emulator configuration (when mode=EMULATOR)
    enabled: true
    dispenser-address: 1
    price-per-liter-cents: 1590  # 15.90 NOK/L
    latency-ms: 20               # Simulated serial delay

# ═══════════════════════════════════════════════════════════════════════════════
# EMULATOR TCP SERVER CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
# 
# The emulator module runs a TCP server that accepts connections from Windows
# "Dispenser Control" application. It translates legacy text commands like
# <TANK_DISP_UNBLOCK> to EHL binary protocol.
#
# Connect from Windows Dispenser Control to: [HOST_IP]:9000
#
# ═══════════════════════════════════════════════════════════════════════════════
emulator:
  address: ${EMULATOR_ADDRESS:1}
  price-per-litre-cents: ${EMULATOR_PRICE_PER_LITRE_CENTS:1590}
  litres-per-second: ${EMULATOR_LITRES_PER_SECOND:0.5}
  # TCP server port for Windows Dispenser Control
  port: ${EMULATOR_PORT:9000}

# LPG API client (emulator -> webapp API)
lpg-api:
  base-url: ${LPG_API_BASE_URL:http://localhost:8080}

# ═══════════════════════════════════════════════════════════════════════════════
# LPG APPLICATION CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
#
# Spring Profiles styrer transport-laget:
#   lab   - InMemorySerialPort + EhlDispenserEmulator (default, ingen hardware)
#   field - SerialPortManager + ekte serial port (produksjon eller socat)
#
# Bruk: --spring.profiles.active=lab eller --spring.profiles.active=field
#
# ═══════════════════════════════════════════════════════════════════════════════
lpg:
  dispenser:
    address: ${LPG_DISPENSER_ADDRESS:1}
  polling:
    interval-ms: ${LPG_POLLING_INTERVAL_MS:2000}
  price:
    per-liter: ${LPG_PRICE_PER_LITER:15.90}
  station:
    id: ${STATION_ID:STATION-001}
    name: ${STATION_NAME:Test Stasjon}
  protocol:
    logging:
      # Enable raw TX/RX HEX logging (true = DEBUG level, false = TRACE level)
      # Default: true in LAB mode, false in FIELD mode
      enabled: ${LPG_PROTOCOL_LOGGING_ENABLED:true}

---
# ═══════════════════════════════════════════════════════════════════════════════
# FIELD OVERRIDE SECTION
# ═══════════════════════════════════════════════════════════════════════════════
#
# Dette avsnittet aktiveres kun når filen lastes med additional-location.
# Brukes for å overstyre serial port parametre i felt.
#
# Eksempel deployment på ARK-3600:
#   ehl.serial.port: /dev/ttyUSB0
#   ehl.serial.parity: EVEN
#
# ═══════════════════════════════════════════════════════════════════════════════

# Override serial port for field deployment (uncomment and modify as needed):
# ehl:
#   serial:
#     port: /dev/ttyUSB0
#     parity: EVEN  # EVEN for real EHL hardware, NONE for simulator
