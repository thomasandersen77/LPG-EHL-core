spring:
  application:
    name: lpg-ehl-headless
  main:
    web-application-type: none
  profiles:
    active: h2
  
  # H2 In-Memory Database Configuration
  datasource:
    url: jdbc:h2:mem:lpgdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # H2 Console (valgfritt - kun for debugging)
  h2:
    console:
      enabled: false
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

# Azure Storage Queue Configuration (disabled for offline testing)
azure:
  enabled: false

# Nets Cloud Connect Configuration (disabled for offline testing)
nets:
  cloud-connect:
    host: localhost
    port: 6001

# ═══════════════════════════════════════════════════════════════════════════════
# LOGGING CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
logging:
  level:
    root: INFO
    no.cloudberries.lpg: INFO
    no.cloudberries.lpg.headless: INFO
    no.cloudberries.lpg.communication: INFO
    org.hibernate.SQL: WARN
    org.springframework: WARN
    liquibase: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{20} - %msg%n"
  file:
    name: /tmp/lpg-ehl/headless.log
    max-size: 10MB
    max-history: 30

# ═══════════════════════════════════════════════════════════════════════════════
# SERIAL PORT CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
# 
# Konfigurerbare parametere for seriell kommunikasjon:
#
#   port:       Seriell port-enhet (Linux: /dev/ttyS0, /dev/ttyUSB0, /dev/ttyAMA0)
#   baud-rate:  Baudrate (standard EHL: 9600)
#   data-bits:  Databit (5, 6, 7, 8 - standard: 8)
#   parity:     Paritet (NONE, ODD, EVEN, MARK, SPACE - standard EHL: EVEN)
#   stop-bits:  Stoppbit (1 eller 2 - standard: 1)
#
# Standard EHL Protocol: 9600 baud, 8E1 (8 data bits, Even parity, 1 stop bit)
#
# ═══════════════════════════════════════════════════════════════════════════════
ehl:
  transport:
    # Transport mode: EMULATOR, SOCAT, or HARDWARE
    mode: HARDWARE
  serial:
    # Serial port device path
    port: /dev/ttyS0
    # Baud rate
    baud-rate: 9600
    # Data bits (5, 6, 7, 8)
    data-bits: 8
    # Parity: NONE, ODD, EVEN, MARK, SPACE
    parity: EVEN
    # Stop bits: 1 or 2
    stop-bits: 1

# LPG Application Configuration
lpg:
  mode: FIELD  # FIELD = ekte hardware
  dispenser:
    address: 1  # Dispenser-adresse å polle
  polling:
    interval-ms: 2000  # Poll-intervall i millisekunder
  price:
    per-liter: 15.90
  station:
    id: STATION-001
    name: LPG Stasjon 1
