# Local Development Docker Compose for LPG-EHL
# Complete stack: Emulator + Database + Azurite + API + Frontend
# Run: docker-compose -f docker-compose-local.yaml up

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: lpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lpg_ehl
      POSTGRES_USER: lpg_user
      POSTGRES_PASSWORD: lpg_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpg_user -d lpg_ehl"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lpg-network

  # Azurite - Azure Storage Emulator
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: lpg-azurite
    restart: unless-stopped
    command: "azurite-queue --queueHost 0.0.0.0 --queuePort 10001 --loose --location /data"
    ports:
      - "10001:10001"
    volumes:
      - azurite-data:/data
    networks:
      - lpg-network

  # LPG-EHL Emulator (standalone for testing)
  emulator:
    build:
      context: .
      dockerfile: Dockerfile.emulator
    container_name: lpg-emulator
    restart: unless-stopped
    environment:
      EMULATOR_ADDRESS: 1
      EMULATOR_PRICE_PER_LITRE_CENTS: 1590
      EMULATOR_LITRES_PER_SECOND: 0.5
      EMULATOR_PORT: 9000
    ports:
      - "9000:9000"
    networks:
      - lpg-network

  # LPG-EHL API
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: lpg-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_started
      emulator:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local,demo
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: lpg_ehl
      DB_USER: lpg_user
      DB_PASSWORD: lpg_dev_password
      AZURE_ENABLED: true
      AZURE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;"
      AZURE_QUEUE_NAME: lpg-transactions
      AZURE_SYNC_INTERVAL: 30
      AZURE_SYNC_BATCH_SIZE: 10
      AZURE_SYNC_MAX_RETRIES: 3
      API_AUTH_TOKEN: dev-token-12345
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      EMULATOR_HOST: emulator
      EMULATOR_PORT: 9000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - lpg-network

  # Frontend - React Web UI
  frontend:
    build:
      context: ./lpg-web
      dockerfile: Dockerfile
    container_name: lpg-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    networks:
      - lpg-network

  # WireMock - Mock external APIs for testing
  wiremock:
    image: wiremock/wiremock:3.3.1
    container_name: lpg-wiremock
    restart: unless-stopped
    command:
      - --global-response-templating
      - --verbose
    ports:
      - "8082:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
      - ./wiremock/__files:/home/wiremock/__files
    networks:
      - lpg-network

networks:
  lpg-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  azurite-data:
    driver: local

# Local development stack
# 
# Start all services:
#   docker-compose -f docker-compose-local.yaml up
#
# Start in background:
#   docker-compose -f docker-compose-local.yaml up -d
#
# View logs:
#   docker-compose -f docker-compose-local.yaml logs -f
#   docker-compose -f docker-compose-local.yaml logs -f api
#
# Stop all:
#   docker-compose -f docker-compose-local.yaml down
#
# Rebuild and start:
#   docker-compose -f docker-compose-local.yaml up --build
#
# Access points:
#   - Frontend:  http://localhost:3000
#   - API:       http://localhost:8080
#   - Swagger:   http://localhost:8080/swagger-ui.html
#   - Emulator:  tcp://localhost:9000
#   - Database:  localhost:5432 (user: lpg_user, password: lpg_dev_password)
#   - Azurite:   localhost:10001
#   - WireMock:  http://localhost:8081
