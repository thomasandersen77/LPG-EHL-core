# ═══════════════════════════════════════════════════════════════════════════════
# FIELD MODE - Ekstern konfigurasjon
# ═══════════════════════════════════════════════════════════════════════════════
#
# Bruk med FIELD profil (ekte hardware eller simulator via socat):
#   java -jar lpg-ehl-webapp.jar --spring.profiles.active=field \
#     --spring.config.location=application-field-external.yaml
#
# Eller for headless:
#   java -jar lpg-ehl-headless.jar --spring.profiles.active=field \
#     --spring.config.location=application-field-external.yaml \
#     --spring.web.application-type=servlet --server.port=8080
#
# Fungerer for BÅDE webapp og headless.
# Alle parametere kan overstyres fra kommandolinje.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# SERIAL PORT (endre for din maskin)
# ───────────────────────────────────────────────────────────────────────────────
ehl:
  serial:
    port: /tmp/vserial1        # SOCAT testing
    # port: /dev/ttyUSB0       # Linux/Mac RS-485 adapter
    # port: /dev/ttyS3         # ARK-3360 (Alejandros setup)
    # port: COM3               # Windows
    
    baud-rate: 9600
    data-bits: 8
    parity: NONE               # NONE for simulator, EVEN for hardware
    stop-bits: 1
    read-timeout-ms: 3000
    write-timeout-ms: 1000
    parity-auto-detect: false  # Sett til true for auto-detect

# ───────────────────────────────────────────────────────────────────────────────
# DATABASE - H2 in-memory (default)
# ───────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:h2:mem:lpgdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  liquibase:
    enabled: true

# ───────────────────────────────────────────────────────────────────────────────
# LOGGING - Både console OG fil
# ───────────────────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    no.cloudberries.lpg: INFO
    no.cloudberries.lpg.protocol: INFO
    no.cloudberries.lpg.communication: INFO
    org.springframework: WARN
    liquibase: WARN
  
  # Log til fil automatisk
  file:
    name: logs/lpg-ehl.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 300MB
  
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%15.15thread] %logger{25} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

# ───────────────────────────────────────────────────────────────────────────────
# EKSTERNE TJENESTER - Disabled for lokal testing
# ───────────────────────────────────────────────────────────────────────────────
azure:
  enabled: false

nets:
  cloud-connect:
    host: localhost
    port: 6001

# ───────────────────────────────────────────────────────────────────────────────
# NOTATER:
# ───────────────────────────────────────────────────────────────────────────────
#
# Dispenser adresser:
#   - Standard: 1-8
#   - Legacy: 33-40 (= standard + 32)
#   - Alejandros pumpe: adresse 34 (= dispenser 2 i legacy)
#
# Override fra kommandolinje:
#   --ehl.serial.port=/dev/ttyS3
#   --ehl.serial.parity=EVEN
#   --server.port=8080
#
# ───────────────────────────────────────────────────────────────────────────────
