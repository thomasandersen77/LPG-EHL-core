# Test Profile Configuration - H2 in-memory
spring:
  application:
    name: lpg-ehl-api-test
  
  # Allow bean definition overriding for RestClientSsl conflict in Spring Boot 3.2.x
  main:
    allow-bean-definition-overriding: true

  # Exclude autoconfiguration that cause NoClassDefFoundError with test classpath
  autoconfigure:
    exclude:
      - org.springframework.boot.http.client.autoconfigure.imperative.ImperativeHttpClientAutoConfiguration
      - org.springframework.boot.http.client.autoconfigure.HttpClientAutoConfiguration
      - org.springframework.boot.autoconfigure.web.client.RestClientAutoConfiguration
      - org.springframework.boot.restclient.autoconfigure.RestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.gson.GsonAutoConfiguration
      - org.springframework.boot.http.converter.autoconfigure.HttpMessageConvertersAutoConfiguration

  # H2 In-Memory Database
  datasource:
    url: jdbc:h2:mem:lpg_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    hibernate:
      ddl-auto: none  # Liquibase manages schema
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Disable Azure for tests
azure:
  enabled: false

# Test security - permitAll
security:
  api-token: test-token-12345
  cors:
    allowed-origins: "*"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging - minimal for tests
logging:
  level:
    root: WARN
    no.cloudberries.lpg: INFO
    org.springframework.security: WARN
    liquibase: WARN
