openapi: 3.0.3
info:
  title: LPG EHL API
  description: REST API for LPG dispenser control, transactions, payments, and credit management
  version: 1.0.0
  contact:
    name: Norges Gass
    
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
  
tags:
  - name: Dispenser
    description: Dispenser control and status
  - name: Transactions
    description: Transaction management and history
  - name: Payments
    description: Payment processing
  - name: Credit
    description: Customer credit accounts
  - name: Reports
    description: Reporting and analytics
  - name: Sync
    description: Azure sync status and control
  - name: Emulator
    description: Emulator control and debugging

paths:
  /dispenser/state:
    get:
      tags: [Dispenser]
      summary: Get current dispenser state
      parameters:
        - name: address
          in: query
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Current dispenser state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispenserState'
  
  /dispenser/unblock:
    post:
      tags: [Dispenser]
      summary: Start fuel delivery
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: integer
                  default: 1
      responses:
        '200':
          description: Delivery started
  
  /dispenser/stop:
    post:
      tags: [Dispenser]
      summary: Stop fuel delivery
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: integer
                  default: 1
      responses:
        '200':
          description: Delivery stopped
  
  /dispenser/reset:
    post:
      tags: [Dispenser]
      summary: Reset dispenser to idle state
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: integer
                  default: 1
      responses:
        '200':
          description: Dispenser reset
  
  /transactions:
    get:
      tags: [Transactions]
      summary: Get transactions with filtering
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: paymentType
          in: query
          schema:
            $ref: '#/components/schemas/PaymentType'
        - name: customerId
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  number:
                    type: integer
                  size:
                    type: integer
  
  /transactions/{id}:
    get:
      tags: [Transactions]
      summary: Get transaction by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Transaction details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          description: Transaction not found
  
  /transactions/count:
    get:
      tags: [Transactions]
      summary: Get transaction count
      responses:
        '200':
          description: Total transaction count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
  
  /payments:
    post:
      tags: [Payments]
      summary: Start a new payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
  
  /payments/{id}:
    get:
      tags: [Payments]
      summary: Get payment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Payment not found
  
  /credit/accounts:
    get:
      tags: [Credit]
      summary: Get all credit accounts
      responses:
        '200':
          description: List of credit accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditAccount'
    post:
      tags: [Credit]
      summary: Create new credit account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreditAccountRequest'
      responses:
        '201':
          description: Credit account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAccount'
  
  /credit/accounts/{id}:
    get:
      tags: [Credit]
      summary: Get credit account by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Credit account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditAccount'
        '404':
          description: Account not found
  
  /credit/accounts/{id}/transactions:
    get:
      tags: [Credit]
      summary: Get transactions for a credit account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
  
  /reports/daily:
    get:
      tags: [Reports]
      summary: Get daily report
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Daily report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReport'
  
  /reports/range:
    get:
      tags: [Reports]
      summary: Get report for date range
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Range report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RangeReport'
  
  /sync/status:
    get:
      tags: [Sync]
      summary: Get Azure sync status
      responses:
        '200':
          description: Sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
  
  /sync/trigger:
    post:
      tags: [Sync]
      summary: Manually trigger sync
      responses:
        '200':
          description: Sync triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  syncedCount:
                    type: integer
  
  /emulator/scenario:
    post:
      tags: [Emulator]
      summary: Set emulator scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetScenarioRequest'
      responses:
        '200':
          description: Scenario set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmulatorStatus'
  
  /emulator/reset/{address}:
    post:
      tags: [Emulator]
      summary: Reset emulator for specific dispenser
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Emulator reset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmulatorStatus'
  
  /emulator/status/{address}:
    get:
      tags: [Emulator]
      summary: Get emulator status
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Emulator status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmulatorStatus'

components:
  schemas:
    DispenserState:
      type: object
      properties:
        address:
          type: integer
        state:
          type: string
          enum: [IDLE, READY, DELIVERING, FINISHED, ERROR]
        litres:
          type: number
          format: double
        amountToPay:
          type: number
          format: double
        pricePerLitre:
          type: number
          format: double
        includeRoadTax:
          type: boolean
        dayMode:
          type: boolean
        connected:
          type: boolean
        lastError:
          type: string
          nullable: true
    
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dispenserAddress:
          type: integer
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        litres:
          type: number
          format: double
        amountNok:
          type: number
          format: double
        pricePerLitreNok:
          type: number
          format: double
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        customerName:
          type: string
          nullable: true
        customerId:
          type: string
          nullable: true
        includesRoadTax:
          type: boolean
        state:
          type: string
    
    PaymentType:
      type: string
      enum: [CASH, CARD, CREDIT, UNKNOWN]
    
    PaymentMethod:
      type: string
      enum: [CASH, CARD, CREDIT]
    
    PaymentStatus:
      type: string
      enum: [PENDING, APPROVED, DECLINED, CANCELLED]
    
    PaymentRequest:
      type: object
      required:
        - amountCents
        - method
        - reference
      properties:
        amountCents:
          type: integer
          format: int64
        method:
          $ref: '#/components/schemas/PaymentMethod'
        reference:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    
    Payment:
      type: object:
      properties:
        id:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        amountCents:
          type: integer
          format: int64
        method:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        reference:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    
    CreditAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerName:
          type: string
        customerNumber:
          type: string
        balanceNok:
          type: number
          format: double
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
    
    CreateCreditAccountRequest:
      type: object
      required:
        - customerName
        - customerNumber
      properties:
        customerName:
          type: string
        customerNumber:
          type: string
        initialBalanceNok:
          type: number
          format: double
          default: 0.0
    
    DailyReport:
      type: object
      properties:
        date:
          type: string
          format: date
        totalLitres:
          type: number
          format: double
        totalAmountNok:
          type: number
          format: double
        transactionCount:
          type: integer
        byPaymentType:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PaymentTypeSummary'
    
    PaymentTypeSummary:
      type: object
      properties:
        litres:
          type: number
          format: double
        amountNok:
          type: number
          format: double
        count:
          type: integer
    
    RangeReport:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totalLitres:
          type: number
          format: double
        totalAmountNok:
          type: number
          format: double
        transactionCount:
          type: integer
        dailyBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/DailyReport'
    
    SyncStatus:
      type: object
      properties:
        unsyncedCount:
          type: integer
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        syncQueueSize:
          type: integer
        isHealthy:
          type: boolean
    
    EmulatorScenario:
      type: string
      enum: [NORMAL, TIMEOUT, CHECKSUM_ERROR, NO_CONNECTION]
    
    SetScenarioRequest:
      type: object
      required:
        - dispenserAddress
        - scenario
      properties:
        dispenserAddress:
          type: integer
        scenario:
          $ref: '#/components/schemas/EmulatorScenario'
    
    EmulatorStatus:
      type: object
      properties:
        dispenserAddress:
          type: integer
        scenario:
          $ref: '#/components/schemas/EmulatorScenario'
        lastMessage:
          type: string
          nullable: true
        lastError:
          type: string
          nullable: true
        connected:
          type: boolean
