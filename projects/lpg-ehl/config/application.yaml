lpg:
  dispenser:
    address: 33
ehl:
  serial:
    port: /tmp/vserial1
    baud-rate: 9600
    parity: NONE
    data-bits: 8
    stop-bits: 1

payment:
  terminal:
    enabled: true

terminal:
  provider: nets-cloud-connect

nets-cloud-connect:
  base-url: https://connectcloud.aws.nets.eu
  username: cloudberries_shared
  password: B8PnVjmVq-SMM9QD
  terminal-id: "42696609"
  websocket:
    ping-interval-ms: 20000
    reconnect-delay-ms: 5000
    max-reconnect-attempts: 10
  timeouts:
    login-timeout-ms: 10000
    open-terminal-timeout-ms: 30000
    purchase-timeout-ms: 60000
    reversal-timeout-ms: 60000
