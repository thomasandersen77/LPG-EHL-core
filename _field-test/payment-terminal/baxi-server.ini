[BAXI]
LogFilePrefix=baxilog
# Log dir must be writable by the process user.
# Use a relative path by default so the output folder is self-contained.
# (Set an absolute path on the station if preferred.)
LogFilePath=./logs
TraceLevel=5
LogAutoDeleteDays=14
SerialDriver=Nets

[TERMINAL]
BaudRate=57600
ComPort=1
DeviceString="SAGEM Telium"
PowerCycleCheck=0
TidSupervision=0

[HOST]
HostPort=9670
# Host endpoints (from vendor examples + legacy VB6):
#
# - Test VPN:
#   HostIpAddress=193.214.20.211
#
# - Prod secure access (VB6 hardcoded):
#   HostIpAddress=91.102.24.142
#
# - Test secure access (vendor package default):
#   HostIpAddress=91.102.24.111
#
# Default to TEST secure access. (The TEST VPN endpoint requires VPN/routes on the Debian box; otherwise it will time out.)
HostIpAddress=91.102.24.142

[DEVICEATTRIBUTES]
VendorInfoExtended=ECR;;;;
CutterSupport=1
PrinterWidth=24
DisplayWidth=24
TerminalReady=1
UseDisplayTextID=1
UseExtendedLocalMode=1
UseSplitDisplayText=0

[TCPIPSERVER]
BluetoothTunnel=0
# Ethernet terminals can connect to BAXI via TCP/IP (BAXI listens on SocketListenerPort).
SocketListener=1
SocketListenerPort=6001
DelegateCommunication=0
LinkControlTimeout=7
AlwaysUseTotalAmountInExtendedLM=1
PreventLoyaltyFromPurchase=0

[MULTIINSTANCE]
UseMultiInstance=0
MultiInstanceConfigFile=/etc/baxi/multi.config
ClientID=ECR1

[MULTICURRENCY]
UseMultiCurrency=0
MultiCurrencyPath=""

[PINBYPASS]
PinByPass=0

[StoreBox]
EnableStoreBox=0
StoreBoxAPIHost=https://api.storebox.com/api/receipt-receiver/v2/receipts
StoreBoxAuthToken=""

[SplitAcquiring]
SplitAcquiring=0

