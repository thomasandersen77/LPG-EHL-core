# Use PostgreSQL from local profile
spring:
  jpa:
    show-sql: false
  liquibase:
    enabled: true
    
server:
  port: 8080

# Emulator connection
emulator:
  host: localhost
  port: 9000

# Disable Azure for demo
azure:
  enabled: false
  
# Demo mode - simplified configuration  
demo:
  mode: true
  
logging:
  level:
    no.cloudberries.lpg: DEBUG
    org.hibernate.SQL: INFO