[defaults]
# Default inventory points to preprod; override with -i inventories/prod/hosts.yml
inventory = inventories/preprod/hosts.yml

# Placeholder; override in inventory/CLI as needed
remote_user = alejandro

# NOTE: convenient for early bootstrap. In production, manage known_hosts instead.
host_key_checking = False

retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
# Speed up SSH-heavy runs for larger fleets
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=4
