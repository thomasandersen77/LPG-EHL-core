---
# Defaults for networking role

# Primary network interface configuration
ark_primary_interface: "{{ ark_nic_name | default('enp0s25') }}"
ark_primary_dhcp: true

# Secondary/terminal network interface (if needed)
ark_terminal_interface: "ens32"
ark_terminal_network: "192.168.50.1/24"

# DNS configuration for dnsmasq (if used)
ark_dnsmasq_enabled: false
ark_dnsmasq_listen_interfaces: []
