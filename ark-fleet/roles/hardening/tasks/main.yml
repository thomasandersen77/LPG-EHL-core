---
# === Locale Configuration ===
- name: Ensure locales package is installed
  ansible.builtin.apt:
    name: locales
    state: present

- name: Configure locale in /etc/locale.gen
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*{{ ark_locale }}\s+UTF-8'
    line: '{{ ark_locale }} UTF-8'
    state: present
  notify: Regenerate locales

- name: Generate locales
  ansible.builtin.command:
    cmd: locale-gen
  changed_when: false

- name: Set default locale
  ansible.builtin.command:
    cmd: "update-locale LANG={{ ark_locale_lang }}"
  changed_when: false

# === Storage Hardening ===
- name: Install hdparm for disk management
  ansible.builtin.apt:
    name:
      - hdparm
      - powermgmt-base
    state: present

- name: Set filesystem error behavior to remount-ro
  ansible.builtin.command:
    cmd: "tune2fs -e remount-ro {{ ark_root_device }}"
  changed_when: false
  failed_when: false
  when: ark_root_device is defined

- name: Disable disk write cache for data integrity
  ansible.builtin.lineinfile:
    path: /etc/hdparm.conf
    regexp: '^#?\s*write_cache\s*='
    line: 'write_cache = off'
    create: true
    mode: "0644"
  when: ark_disable_write_cache | bool

- name: Configure hdparm settings for root disk
  ansible.builtin.blockinfile:
    path: /etc/hdparm.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK - ARK DISK SETTINGS"
    block: |
      {{ ark_root_disk }} {
          write_cache = off
      }
    create: true
    mode: "0644"
  when: ark_disable_write_cache | bool and ark_root_disk is defined

- name: Apply hdparm settings immediately
  ansible.builtin.command:
    cmd: "hdparm -W0 {{ ark_root_disk }}"
  changed_when: false
  failed_when: false
  when: ark_disable_write_cache | bool and ark_root_disk is defined

# === SSH Hardening ===
- name: Ensure OpenSSH server is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Ensure SSH service is enabled and running
  ansible.builtin.service:
    name: ssh
    enabled: true
    state: started

- name: Set PermitRootLogin no
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^(#\s*)?PermitRootLogin\s+'
    line: 'PermitRootLogin no'
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart ssh

- name: Set PasswordAuthentication yes (TODO: disable after SSH keys confirmed)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^(#\s*)?PasswordAuthentication\s+'
    line: 'PasswordAuthentication yes  # TODO: set to "no" after key-based auth is verified'
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart ssh

- name: TODO placeholder for firewall hardening
  ansible.builtin.debug:
    msg: "TODO: add firewall rules (out of scope for this skeleton)"

