---
# Defaults for app role

# Application runtime user (non-privileged)
ark_app_user_name: appuser
ark_app_user_groups:
  - dialout      # Serial port access (ttyS*, ttyUSB*, ttyACM*)
  - plugdev      # USB device access
  - gpio         # GPIO access (if needed)
  - i2c          # I2C bus access (if needed)

# Application directories
ark_app_install_dir: /opt/app
ark_app_data_dir_user: /var/lib/app
ark_app_log_dir_user: /var/log/app
ark_app_config_dir: /etc/app

# Systemd service
ark_app_service_name: arkapp

