#### ARK 3360 Preseed Configuration
#### Automates Debian 12 installation with SSH access pre-configured
####
#### IMPORTANT: Replace SSH key placeholders with your actual keys before use

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network configuration
# Use DHCP for initial installation
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string ark-device
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

### Mirror settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Account setup
# Disable root account (SSH key access only via sudo)
d-i passwd/root-login boolean false

# Create arkadmin user
d-i passwd/user-fullname string ARK Admin
d-i passwd/username string arkadmin
# Password hash (change or use SSH keys only)
# Generate with: mkpasswd -m sha-512
d-i passwd/user-password-crypted password $6$rounds=656000$yoursalthere$yourhashhere
d-i passwd/user-default-groups string sudo

### Clock and time zone
d-i clock-setup/utc boolean true
d-i time/zone string US/Eastern
d-i clock-setup/ntp boolean true
d-i clock-setup/ntp-server string pool.ntp.org

### Partitioning
# Use entire disk with LVM
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Package selection
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server sudo curl ca-certificates
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

### Finishing up
d-i finish-install/reboot_in_progress note

### Late command - Configure SSH keys and system
d-i preseed/late_command string \
# Create SSH directory \
in-target mkdir -p /home/arkadmin/.ssh; \
in-target chmod 700 /home/arkadmin/.ssh; \
\
# Add SSH authorized keys - REPLACE WITH YOUR ACTUAL KEYS \
echo "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAACAQC_YOUR_DEV1_KEY_HERE dev1@laptop" > /target/home/arkadmin/.ssh/authorized_keys; \
echo "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAACAQD_YOUR_DEV2_KEY_HERE dev2@laptop" >> /target/home/arkadmin/.ssh/authorized_keys; \
\
# Set proper permissions \
in-target chmod 600 /home/arkadmin/.ssh/authorized_keys; \
in-target chown -R arkadmin:arkadmin /home/arkadmin/.ssh; \
\
# Configure passwordless sudo \
echo "arkadmin ALL=(ALL:ALL) NOPASSWD:ALL" > /target/etc/sudoers.d/90-arkadmin; \
in-target chmod 440 /etc/sudoers.d/90-arkadmin; \
\
# Harden SSH configuration \
in-target sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config; \
in-target sed -i 's/^#*PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config; \
in-target sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config; \
\
# Enable and start SSH \
in-target systemctl enable ssh
