databaseChangeLog:
  - changeSet:
      id: 006-add-payment-status-column
      author: warp-ai
      changes:
        - addColumn:
            tableName: transactions
            columns:
              - column:
                  name: payment_status
                  type: varchar(20)
                  defaultValue: 'PENDING'
                  constraints:
                    nullable: false
        - sql:
            sql: "UPDATE transactions SET payment_status = 'PAID' WHERE payment_type IN ('CASH', 'CARD', 'CREDIT')"
        - addColumn:
            tableName: transactions
            columns:
              - column:
                  name: comment
                  type: clob
                  remarks: "All existing transactions are marked as PAID since they were completed before payment status tracking was implemented"
