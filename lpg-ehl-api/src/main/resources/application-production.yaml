# Production Profile for Render Deployment
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  liquibase:
    enabled: true
    drop-first: false # Do NOT drop schema in production

# Emulator connection (internal networking on Render)
emulator:
  base-url: ${EMULATOR_BASE_URL:http://lpg-emulator:10000}
  connect-timeout-ms: 5000
  read-timeout-ms: 10000

# Azure - Real Azure Storage Queue
azure:
  enabled: ${AZURE_ENABLED:false}  # Disabled by default, set via env var
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING}
    queue-name: ${AZURE_QUEUE_NAME:lpg-transactions}
  sync:
    interval-seconds: ${AZURE_SYNC_INTERVAL:300}
    batch-size: ${AZURE_SYNC_BATCH_SIZE:10}
    max-retries: ${AZURE_SYNC_MAX_RETRIES:5}

# Security
security:
  api-token: ${API_AUTH_TOKEN}  # MUST be set via environment
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# Actuator - Limited exposure in production
management:
  endpoint:
    health:
      show-details: when-authorized

# Logging - Production levels
logging:
  level:
    root: INFO
    no.cloudberries.lpg: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
