# Local Development Profile
# Note: datasource config is inherited from application.yaml which uses environment variables
# This allows the same profile to work both locally and in Docker
spring:
  jpa:
    hibernate:
      ddl-auto: update  # Auto-create/update schema for local development
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Azure - Use Azurite for local development
azure:
  enabled: true
  storage:
    connection-string: UseDevelopmentStorage=true;DevelopmentStorageProxyUri=http://localhost:10001
    queue-name: lpg-transactions
  sync:
    interval-seconds: 30  # More frequent for local testing
    batch-size: 5
    max-retries: 3

# Security - Simple token for local dev
security:
  api-token: dev-token-12345
  cors:
    allowed-origins: http://localhost:3000,http://localhost:8080,http://localhost:5173

# Actuator - Show full details locally
management:
  endpoint:
    health:
      show-details: always

# Logging - More verbose for development
logging:
  level:
    root: INFO
    no.cloudberries.lpg: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
