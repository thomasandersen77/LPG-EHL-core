# ═══════════════════════════════════════════════════════════════════════════════
# LAB MODE - Ekstern konfigurasjon
# ═══════════════════════════════════════════════════════════════════════════════
#
# Bruk med LAB profil (emulator, ingen ekte hardware):
#   java -jar lpg-ehl-webapp.jar --spring.profiles.active=lab \
#     --spring.config.location=application-local.yaml
#
# Fungerer for BÅDE webapp og headless.
# Alle parametere kan overstyres fra kommandolinje.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# DATABASE - H2 in-memory (resets ved restart)
# ───────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:h2:mem:lpgdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  liquibase:
    enabled: true

# ───────────────────────────────────────────────────────────────────────────────
# LOGGING - Både console OG fil
# ───────────────────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    no.cloudberries.lpg: INFO
    no.cloudberries.lpg.protocol: INFO
    no.cloudberries.lpg.communication: INFO
    no.cloudberries.lpg.emulator: INFO
    org.springframework: WARN
    liquibase: INFO
  
  # Log til fil automatisk
  file:
    name: logs/lpg-ehl.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 300MB
  
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%15.15thread] %logger{25} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

# ───────────────────────────────────────────────────────────────────────────────
# EKSTERNE TJENESTER - Disabled for lokal testing
# ───────────────────────────────────────────────────────────────────────────────
azure:
  enabled: false

nets:
  cloud-connect:
    host: localhost
    port: 6001
